name: Sync ORCID and deploy CV

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 1 * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Synchronize public ORCID data
        run: python scripts/sync_orcid.py

      - name: Save monthly ORCID snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orcid.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync ORCID snapshot"
            git pull --rebase
            git push
          fi

      - name: Build bilingual site
        run: python scripts/build_site.py

      - name: Render Korean and English PDFs
        run: python scripts/render_pdfs.py

      - name: Verify generated output
        run: python scripts/check_output.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
